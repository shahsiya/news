<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Лента новостей</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
      font-size: 2em;
    }
    #controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    #refreshBtn, #resetFilter {
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
      background-color: #007bff;
      border: none;
      border-radius: 5px;
      color: white;
    }
    #searchInput, #sourceFilter {
      padding: 8px;
      font-size: 1em;
      border-radius: 5px;
      border: 1px solid #ccc;
      min-width: 200px;
      max-width: 300px;
      flex-grow: 1;
    }
    #news {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }
    .news-card {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      background-color: white;
    }
    .news-title {
      font-weight: bold;
      font-size: 1.2em;
      margin-bottom: 8px;
      color: #222;
    }
    .news-summary {
      margin-bottom: 8px;
      color: #555;
    }
    .news-link {
      color: #007bff;
      text-decoration: none;
      font-weight: 600;
    }
    .news-link:hover {
      text-decoration: underline;
    }
    #pagination {
      text-align: center;
      margin-top: 25px;
      flex-wrap: wrap;
      display: flex;
      justify-content: center;
      gap: 5px;
    }
    #pagination button {
      margin: 0 3px;
      padding: 8px 12px;
      font-size: 1em;
      cursor: pointer;
      border: 1px solid #007bff;
      background-color: white;
      color: #007bff;
      border-radius: 5px;
    }
    #pagination button.active,
    #pagination button:hover {
      background-color: #007bff;
      color: white;
    }
    @media (max-width: 700px) {
      #news { grid-template-columns: 1fr; }
      #controls { flex-direction: column; align-items: stretch; }
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB15DfYRfexQNhiToIrqBb5L7hRIEctM3I",
      authDomain: "news-d2cb9.firebaseapp.com",
      projectId: "news-d2cb9",
      storageBucket: "news-d2cb9.appspot.com",
      messagingSenderId: "59311537316",
      appId: "1:59311537316:web:2bd53798a9085263b2ba31",
      measurementId: "G-4D8G8PHXQ4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ITEMS_PER_PAGE = 50;
    let allNews = [];
    let filteredNews = [];
    let currentPage = 1;

    async function loadNews() {
      const container = document.getElementById('news');
      container.innerHTML = '<p>Загрузка новостей...</p>';
      try {
        const querySnapshot = await getDocs(collection(db, "news"));
        allNews = [];
        querySnapshot.forEach(doc => {
          const newsItem = doc.data();
          newsItem.id = doc.id;
          allNews.push(newsItem);
        });

        if (allNews.length === 0) {
          container.innerHTML = '<p>Новостей пока нет.</p>';
          return;
        }

        setupSourceFilter();
        applyFilters();
      } catch (error) {
        container.innerHTML = `<p>Ошибка загрузки: ${error.message}</p>`;
      }
    }

    function setupSourceFilter() {
      const sourceFilter = document.getElementById('sourceFilter');
      const sources = Array.from(new Set(allNews.map(n => n.source).filter(Boolean))).sort();

      sourceFilter.innerHTML = '<option value="">Все источники</option>';
      sources.forEach(source => {
        const option = document.createElement('option');
        option.value = source;
        option.textContent = source;
        sourceFilter.appendChild(option);
      });
    }

    function applyFilters() {
      const searchValue = document.getElementById('searchInput').value.toLowerCase();
      const sourceValue = document.getElementById('sourceFilter').value;

      filteredNews = allNews.filter(n => {
        const title = (n.title || '').toLowerCase();
        const source = n.source || '';
        return title.includes(searchValue) && (sourceValue === '' || source === sourceValue);
      });

      currentPage = 1;
      renderPage(currentPage);
      renderPagination();
    }

    function renderPage(page) {
      const container = document.getElementById('news');
      container.innerHTML = '';

      const start = (page - 1) * ITEMS_PER_PAGE;
      const end = start + ITEMS_PER_PAGE;
      const pageItems = filteredNews.slice(start, end);

      if (pageItems.length === 0) {
        container.innerHTML = '<p>Нет новостей для отображения.</p>';
        return;
      }

      pageItems.forEach(news => {
        const card = document.createElement('div');
        card.className = 'news-card';

        card.innerHTML = `
          <div class="news-title">${news.title || 'Без заголовка'}</div>
          <div class="news-summary">${news.summary || ''}</div>
          <div><strong>Источник:</strong> ${news.source || 'Неизвестно'}</div>
          ${news.url ? `<a href="${news.url}" target="_blank" class="news-link">Читать далее</a>` : ''}
        `;
        container.appendChild(card);
      });
    }

    function renderPagination() {
      const paginationContainer = document.getElementById('pagination');
      paginationContainer.innerHTML = '';

      const totalPages = Math.ceil(filteredNews.length / ITEMS_PER_PAGE);
      if (totalPages <= 1) return;

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        if (i === currentPage) btn.classList.add('active');
        btn.addEventListener('click', () => {
          currentPage = i;
          renderPage(currentPage);
          renderPagination();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        paginationContainer.appendChild(btn);
      }
    }

    window.onload = () => {
      loadNews();
      document.getElementById('refreshBtn').addEventListener('click', loadNews);
      document.getElementById('searchInput').addEventListener('input', applyFilters);
      document.getElementById('sourceFilter').addEventListener('change', applyFilters);
      document.getElementById('resetFilter').addEventListener('click', () => {
        document.getElementById('searchInput').value = '';
        document.getElementById('sourceFilter').value = '';
        applyFilters();
      });
    };
  </script>
</head>
<body>
  <h1>Лента новостей</h1>
  <div id="controls">
    <button id="refreshBtn">Обновить</button>
    <input type="text" id="searchInput" placeholder="Поиск по заголовку" />
    <select id="sourceFilter"></select>
    <button id="resetFilter">Сбросить фильтр</button>
  </div>
  <div id="news"></div>
  <div id="pagination"></div>
</body>
</html>
