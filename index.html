<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Новости 24/7</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="app.js"></script>
</head>
<body>
  <header id="header">
    <div id="logo">
      <img src="https://cdn-icons-png.flaticon.com/512/60/60525.png" alt="Логотип Новости" />
    </div>
    <div id="title">
      <h1>Новости 24/7</h1>
      <p>Свежие новости со всего мира</p>
    </div>
  </header>

  <div id="controls">
    <button id="refreshBtn">Обновить</button>
    <input type="text" id="searchInput" placeholder="Поиск по заголовку" />
    <select id="sourceFilter"></select>
    <button id="resetFilter">Сбросить фильтр</button>
  </div>

  <div id="vacancies"></div>
  <div id="pagination"></div>
</body>
</html>
